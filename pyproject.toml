[project]
name = "aiph2-learn-agent"
version = "0.1.0"
description = "AIPH2 Active Learning Agent - standalone Python REPL with SM-2 incremental learning, interest profile, and less-style pager"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk",
    "rich>=13.0.0",
    "python-frontmatter>=1.0",
    "PyYAML>=6.0",
    "python-docx>=1.1",
    "pydantic>=2.0",
]

[dependency-groups]
dev = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["modules"]
